<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Login</h2>
            <form>
                <div class="input-box">
                    <label>📧</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="input-box">
                    <label>🔏</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <a href="#" class="forgot">Forgot password?</a>
                <button type="submit" class="login-btn">Login</button>
                <p class="signup">Don't have an account? <a href="Registration.html">Signup now</a></p>
            </form>
        </div>
       <div class="info-box">
       <div class="solid-overlay">
    <div class="info-text">
        <h2>Every new friend is a<br>new adventure.</h2>
        <p>let's get connected</p>
    </div>
</div>

</body>
</html>
